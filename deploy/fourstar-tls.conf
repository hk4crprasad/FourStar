server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fourstar.phirmy.com;
    ssl_certificate /etc/letsencrypt/live/fourstar.phirmy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fourstar.phirmy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
